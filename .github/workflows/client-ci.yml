name: Client CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify public source boundary
        run: ./scripts/verify-public-tree.sh
      - name: Verify source version
        run: ./scripts/verify-source-version.sh
      - name: Test, lint and build the complete client
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
