name: Retain five releases

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retain-five-releases
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete official releases older than the latest five
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );
            const official = releases
              .filter((release) => !release.draft && !release.prerelease)
              .sort((left, right) => Date.parse(
                right.published_at ?? right.created_at
              ) - Date.parse(left.published_at ?? left.created_at));

            for (const release of official.slice(5)) {
              core.info(`Deleting ${release.tag_name} (${release.id})`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch (error) {
                if (error.status !== 404 && error.status !== 422) throw error;
                core.warning(`Tag ${release.tag_name} was already absent`);
              }
            }

            core.info(`Kept ${Math.min(official.length, 5)} official release(s)`);
